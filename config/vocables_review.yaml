# Revisión humana de los candidatos a vocablo/muletilla (E2). Candidatos: SOLO train de
# lyrics_full_v1 -> data/processed/nlp/lyrics_full_v1/frequency/vocable_candidates.json.
# `pipelines/nlp/e2_frequency.py vocables` aplica esta revisión y genera config/vocables.yaml.
# Definición: vocablo = sonido vocal no léxico (relleno, interjección primaria, sílaba cantada,
# ad-lib o risa). Quedan fuera las interjecciones con contenido léxico, onomatopeyas que son
# palabras de diccionario, nombres, abreviaturas, palabras extranjeras y fragmentos de tokenización.
rule: >-
  base = candidatos con POS mayoritario INTJ (spaCy, train, frecuencia regex >= 100) o con
  autorrepetición >= 0.2 (bigrama "w w" en el verso, frecuencia >= 1000), menos `exclude`, más
  `include`; las formas de sílaba repetida o alargadas (>= 3 letras iguales) entran sólo si una de
  sus reducciones (colapsar letras repetidas o tomar la sílaba repetida) pertenece a la base.
include:
  huh: "interjección; spaCy la etiqueta PROPN 52 % / INTJ 44 %"
  ayy: "ad-lib; spaCy PROPN 96 %"
  ohh: "variante de oh; spaCy NOUN/PROPN"
  uhh: "variante de uh; spaCy PROPN/NOUN"
  yuh: "ad-lib (variante de yeah); spaCy PROPN 91 %"
  woo: "grito/ad-lib; spaCy PROPN 84 %"
  ugh: "interjección; spaCy PROPN/NOUN"
exclude:
  # interjecciones o marcadores con contenido léxico
  well: "adverbio y marcador discursivo léxico (además es stopword)"
  please: "cortesía, contenido léxico"
  "yes": "afirmación léxica"
  hello: "saludo léxico"
  hi: "saludo léxico"
  bye: "despedida léxica"
  amen: "fórmula religiosa"
  alleluia: "fórmula religiosa"
  hallelu: "fórmula religiosa (hallelujah truncado)"
  hurrah: "exclamación léxica"
  alas: "exclamación léxica"
  gosh: "exclamación léxica (eufemismo de god)"
  lordy: "exclamación léxica (lord)"
  damn: "expletivo con contenido léxico"
  yay: "exclamación léxica de celebración"
  # onomatopeyas que son palabras de diccionario
  bang: "onomatopeya léxica (verbo/sustantivo)"
  boom: "onomatopeya léxica"
  tick: "onomatopeya léxica"
  bling: "sustantivo (slang)"
  pow: "onomatopeya léxica"
  beep: "onomatopeya léxica"
  bam: "onomatopeya léxica"
  ding: "onomatopeya léxica"
  ching: "onomatopeya léxica (cha-ching)"
  zoom: "verbo/onomatopeya léxica"
  vroom: "onomatopeya léxica"
  whoop: "verbo/onomatopeya léxica"
  meow: "onomatopeya léxica (animal)"
  woof: "onomatopeya léxica (animal)"
  moo: "onomatopeya léxica (animal)"
  quack: "onomatopeya léxica (animal)"
  baa: "onomatopeya léxica (animal)"
  toot: "onomatopeya léxica"
  thump: "onomatopeya léxica"
  chug: "verbo"
  pew: "sustantivo / onomatopeya de disparo ambigua"
  choo: "onomatopeya léxica (choo choo)"
  boop: "onomatopeya léxica"
  bop: "verbo/sustantivo (bop)"
  bum: "sustantivo léxico"
  tat: "sustantivo (tattoo) / onomatopeya ambigua"
  coo: "verbo léxico"
  poo: "sustantivo léxico"
  goo: "sustantivo léxico"
  yum: "exclamación léxica"
  yummy: "adjetivo"
  goody: "sustantivo/adjetivo"
  wiggle: "verbo"
  shimmy: "verbo"
  twinkle: "verbo"
  merrily: "adverbio"
  mayday: "sustantivo"
  looky: "verbo (look)"
  licky: "derivado léxico (lick)"
  diggy: "derivado léxico (dig)"
  chitty: "título/nombre (Chitty Chitty Bang Bang)"
  noel: "sustantivo/nombre propio"
  # nombres propios
  ella: "nombre propio"
  jolene: "nombre propio"
  pam: "nombre propio"
  # palabras extranjeras
  su: "palabra española"
  lo: "pronombre español / inglés arcaico (ambiguo)"
  oui: "palabra francesa"
  ola: "palabra española"
  andale: "palabra española"
  # slang léxico y abreviaturas
  slatt: "slang léxico (acrónimo)"
  skeet: "slang léxico"
  tf: "abreviatura"
  pls: "abreviatura de please"
  plz: "abreviatura de please"
  abt: "abreviatura de about"
  # fragmentos de tokenización o tartamudeo (w-w-what, ch-ch-changes)
  wh: "fragmento de tartamudeo"
  ch: "fragmento de tartamudeo"
  tr: "fragmento de tartamudeo"
  thi: "fragmento de tartamudeo"
  soundin: "fragmento (soundin')"
  wih: "fragmento/ortografía no estándar de with"
  tanky: "palabra léxica"
  yoy: "ambiguo, sin sentido verificable"
  # nombres o palabras con forma de sílaba repetida (candidatos sólo por patrón)
  papa: "sustantivo léxico"
  gaga: "nombre propio / adjetivo"
  popo: "slang léxico (policía)"
  riri: "nombre propio (Rihanna)"
  bobo: "sustantivo léxico"
  lili: "nombre propio"
  tata: "sustantivo léxico / despedida"
  tutu: "sustantivo léxico"
  pepe: "nombre propio"
  baba: "sustantivo/nombre ambiguo"
  dodo: "sustantivo léxico"
