name: sonora
services:
  couchdb:
    image: ${COUCHDB_IMAGE:-couchdb:3}
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-sonora_admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./infra/couchdb/local.ini:/opt/couchdb/etc/local.d/sonora.ini:ro
    restart: unless-stopped

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3}
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    profiles: ["jobs"]
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  couchdb_data:
  opensearch_data:
  redis_data:
