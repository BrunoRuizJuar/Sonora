<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SONORA</title>
<link rel="icon" href="/assets/brand/cactus-sonora.svg">
<link rel="stylesheet" href="/sonora.css">
<script src="/player.js" defer></script>
</head>
<body>
<header class="site-header">
 <a class="brand" href="/"><img src="/assets/brand/cactus-sonora.svg" alt="">SONORA</a>
 <a href="#saved">Guardadas</a>
</header>
<main>
 <section class="discovery" aria-labelledby="search-title">
  <h1 id="search-title">Encuentra tu frecuencia</h1>
  <form id="search" role="search" aria-label="Buscar canciones">
   <label for="query">Título o artista</label>
   <div class="search-row"><input id="query" type="search" maxlength="200" required placeholder="Ej. Freeway Kurt Vile"><button class="primary">Buscar</button></div>
  </form>
  <button id="example" class="text-button" type="button">Probar con «Freeway» de Kurt Vile</button>
  <p id="search-status" role="status"></p>
  <ul id="results" class="track-list"></ul>
 </section>
 <section class="player" aria-labelledby="player-title">
  <div class="now">
   <small>EN REPRODUCCIÓN</small>
   <h2 id="player-title">Elige una canción</h2>
   <p id="artist"></p>
  </div>
  <audio id="audio" preload="none"></audio>
  <div class="timeline">
   <span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Posición de reproducción" disabled><span id="duration">0:00</span>
  </div>
  <div class="transport">
   <button id="previous" type="button" disabled>⏮ Atrás</button>
   <button id="toggle" type="button" class="primary" disabled>▶ Reproducir</button>
   <button id="next" type="button" disabled>Siguiente ⏭</button>
  </div>
  <div class="player-actions">
   <button id="save" type="button" disabled aria-pressed="false">♡ Guardar</button>
   <button id="lyrics" type="button" disabled aria-expanded="false" aria-controls="comparison">Letras</button>
  </div>
  <p id="up-next" class="up-next">La siguiente canción aparecerá aquí.</p>
  <p id="player-status" role="status"></p>
  <small id="license"></small>
 </section>
 <section id="comparison" class="comparison" aria-labelledby="comparison-title" hidden>
  <h2 id="comparison-title">Letras lado a lado</h2>
  <div id="lyric-columns" class="lyric-columns"></div>
 </section>
 <section id="saved" aria-labelledby="saved-title">
  <h2 id="saved-title">Guardadas</h2>
  <p id="saved-empty">Las canciones que guardes aparecerán aquí.</p>
  <ul id="saved-list" class="track-list"></ul>
 </section>
</main>
</body>
</html>
